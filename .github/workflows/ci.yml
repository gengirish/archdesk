name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    # Pinned: Playwright doesn't support ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Clerk keys are needed to prerender pages (build) and to boot the dev server (E2E).
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma client generation
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e_public:
    # Pinned: Playwright doesn't support ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Chromium and its system libraries come preinstalled, so the job never
    # needs the Ubuntu apt mirrors (which kept timing out on `--with-deps`).
    # Keep the tag in sync with @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    # Clerk keys are needed to prerender pages (build) and to boot the dev server (E2E).
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run public smoke E2E
        run: npm run test:e2e:public
